<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d47a1"/>
      <stop offset="100%" style="stop-color:#1976d2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Gold accent bar -->
  <rect x="0" y="530" width="1200" height="100" fill="#c79a00" opacity="0.25"/>

  <!-- Star + Calendar icons -->
  <text x="600" y="180" font-family="serif" font-size="100" text-anchor="middle" fill="white" opacity="0.9">✡️  📅</text>

  <!-- Title -->
  <text x="600" y="300" font-family="Arial, sans-serif" font-size="90" font-weight="bold"
        text-anchor="middle" fill="white">לוח מועדים</text>

  <!-- Subtitle -->
  <text x="600" y="380" font-family="Arial, sans-serif" font-size="38"
        text-anchor="middle" fill="#bbdefb">אירועים יהודיים שנתיים ביומן שלך</text>

  <!-- URL -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="26"
        text-anchor="middle" fill="#ffffffaa">erezdaniel7.github.io/luach-moadim</text>
</svg>
